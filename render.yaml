services:
  - type: web
    name: sentinel-bank-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: EMAIL
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    name: sentinel-bank-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://sentinel-bank-backend.onrender.com/api
      - key: NODE_ENV
        value: production
