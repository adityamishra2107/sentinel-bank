databases:
  - name: sentinel-bank-db
    databaseName: sentinel_bank
    user: sentinel_user
    plan: free

services:
  - type: web
    name: sentinel-bank-backend
    runtime: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-bank-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: EMAIL
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    name: sentinel-bank-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
